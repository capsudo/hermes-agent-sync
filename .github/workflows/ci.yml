name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      TMPDIR: ${{ github.workspace }}/.scratch
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: |
          mkdir -p "$TMPDIR"
          python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: python -m pytest
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel, = Path("dist").glob("*.whl")
          sdist, = Path("dist").glob("*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              wheel_paths = archive.namelist()
          with tarfile.open(sdist) as archive:
              source_paths = archive.getnames()
          for name in [*wheel_paths, *source_paths]:
              assert not {".private", ".scratch", ".venv", "memories"} & set(Path(name).parts), name
          assert "hermes_agent_sync/cli.py" in wheel_paths
          assert any(name.endswith("/tests/conftest.py") for name in source_paths)
          PY
      - name: Test fresh wheel installation outside the checkout
        run: |
          python -m venv .scratch/wheel-venv
          .scratch/wheel-venv/bin/python -m pip install dist/*.whl 'pytest>=8.3,<10'
          cd .scratch
          wheel-venv/bin/python -m pytest "$GITHUB_WORKSPACE/tests"
