[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-sync"
version = "0.1.0.dev0"
description = "Synchronize selected Hermes profile files through a private Git repository."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
hermes-agent-sync = "hermes_agent_sync.cli:main"

[tool.setuptools.package-data]
hermes_agent_sync = ["default-sync.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
